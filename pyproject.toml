[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "Interleave-Playlist"
version = "1.0.0-alpha10.post1"
description = "Interleave episodes of the shows you watch to maximize variety when catching up"
readme = "README.md"
keywords = ["interleave", "playlist", "episode", "show"]
authors = [{ name = "Thomas Sweeney" }]
license = "GPL-3.0-or-later"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
]
dependencies = [
    "ruamel.yaml~=0.18.6",
    "PySide6~=6.8.0",
    "pymediainfo~=7.0.1",
    "crontab~=1.0.1",
    "natsort~=8.4.0",
    "appdirs~=1.4.4",
]

[project.optional-dependencies]
testing = [
    "pytest~=8.3.2",
    "pytest-mock~=3.14.0",
    "pytest-cov~=6.0.0",
    "flake8~=7.1.1",
    "mypy",
    "IceSpringPySideStubs-PySide6~=1.3.1",
    "tox~=4.24.1",
    "freezegun~=1.5.1",
    "pre-commit~=4.1.0",
    "mkdocs~=1.6.0",
]

[project.urls]
Repository = "https://github.com/tsweeney256/interleave_playlist"

[project.gui-scripts]
interleave-playlist = "interleave_playlist.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
interleave_playlist = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-rfE -q --cov=interleave_playlist --cov-report html"
testpaths = [
    "test",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
show_error_codes = true